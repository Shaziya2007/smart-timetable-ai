<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
#erd svg.erDiagram text { fill: #1a1a1a !important; }
#erd svg.erDiagram .er.entityBox { fill: #f1efe8 !important; }
#erd svg.erDiagram .er.relationshipLabelBox { fill: #ffffff !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: '#444441',
    textColor: '#1a1a1a',
    primaryTextColor: '#1a1a1a',
    entityBorder: '#5f5e5a',
  },
});
const src = `erDiagram
  DEPARTMENTS ||--o{ USERS : employs
  DEPARTMENTS ||--o{ SUBJECTS : offers
  DEPARTMENTS ||--o{ SECTIONS : has
  SECTIONS ||--o{ USERS : contains
  SECTIONS ||--o{ TIMETABLES : scheduled_for
  TIMESLOTS ||--o{ TIMETABLES : occupies
  SUBJECTS ||--o{ TIMETABLES : taught_in
  CLASSROOMS ||--o{ TIMETABLES : booked_in
  USERS ||--o{ TIMETABLES : teaches
  TIMETABLES ||--o{ ADJUSTMENTS : modified_by
  USERS ||--o{ NOTIFICATIONS : receives
  USERS ||--o{ ADJUSTMENTS : creates

  USERS {
    ObjectId id PK
    string name
    string email
    string role
    ObjectId departmentId FK
  }
  DEPARTMENTS {
    ObjectId id PK
    string name
    string code
  }
  SUBJECTS {
    ObjectId id PK
    string name
    ObjectId departmentId FK
    string type
  }
  CLASSROOMS {
    ObjectId id PK
    string roomNumber
    string type
  }
  SECTIONS {
    ObjectId id PK
    ObjectId departmentId FK
    number year
    string sectionName
  }
  TIMESLOTS {
    ObjectId id PK
    string day
    number periodNumber
  }
  TIMETABLES {
    ObjectId id PK
    ObjectId sectionId FK
    ObjectId timeSlotId FK
    ObjectId subjectId FK
    ObjectId facultyId FK
    ObjectId classroomId FK
    string status
  }
  ADJUSTMENTS {
    ObjectId id PK
    string type
    ObjectId originalTimetableId FK
    ObjectId createdBy FK
  }
  NOTIFICATIONS {
    ObjectId id PK
    ObjectId userId FK
    string message
    boolean isRead
  }
`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
